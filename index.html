:root{--lav:#7C68B0;--plum:#49395D;--soft:#F5F0FA;--ivory:#FAF8F5;--ink:#292531;--sage:#526B5B;--sagebg:#EAF1E9;--peach:#E8BFA8;--bd:#E8E3EE;--mut:#645E70;--card:#fff;--warn:#8A5A2B;--err:#A33A4A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ivory:#1E1A26;--soft:#2A2435;--card:#252030;--ink:#F1EEF6;--plum:#D9CFEE;--bd:#3B3348;--mut:#B3ACC0;--sagebg:#243229;--sage:#9CC3A9}}
:root[data-theme="dark"]{--ivory:#1E1A26;--soft:#2A2435;--card:#252030;--ink:#F1EEF6;--plum:#D9CFEE;--bd:#3B3348;--mut:#B3ACC0;--sagebg:#243229;--sage:#9CC3A9}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--ivory);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tajawal,'Segoe UI',Tahoma,'Noto Sans Arabic','Noto Naskh Arabic',Arial,sans-serif;line-height:1.8;font-size:16px}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px;border-radius:8px}
h1,h2,h3{color:var(--plum);line-height:1.4;margin:0 0 .5em}h1{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:700}h2{font-size:clamp(1.4rem,3.4vw,2rem)}h3{font-size:1.1rem}p{margin:0 0 1em}
.mut{color:var(--mut)}.wrap{max-width:1120px;margin:0 auto;padding:0 20px}.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:12px;border:1.5px solid var(--lav);background:var(--lav);color:#fff;font-weight:600;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.sec{background:transparent;color:var(--plum)}.btn.sm{min-height:44px;padding:0 14px;font-size:.9rem}.btn.dng{border-color:var(--err);color:var(--err);background:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--plum);border:1px solid var(--bd)}
.badge.ok{background:var(--sagebg);color:var(--sage)}.badge.demo{background:#FBEFE6;color:var(--warn);border-color:var(--peach)}
.prog{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}.prog i{display:block;height:100%;background:var(--sage);transition:width .4s}
.note{background:#FBEFE6;border:1px solid var(--peach);color:#5C3A18;border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .note,:root:not([data-theme="light"]) .badge.demo{background:#3A2C22;color:#F0D5C0}}
label{display:block;font-weight:600;margin-bottom:4px;font-size:.95rem}

.bars{display:flex;align-items:flex-end;gap:10px;height:120px;direction:rtl}.bars div{flex:1;background:var(--lav);border-radius:8px 8px 0 0;position:relative}.bars span{position:absolute;bottom:-24px;width:100%;text-align:center;font-size:.75rem;color:var(--mut)}

<body>
<a class="skip" href="#main" onclick="event.preventDefault();var m=document.getElementById('main');if(m)m.focus()">تخطي إلى المحتوى الرئيسي</a>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const Mark=`<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#49395D"/><path d="M7 25c6 0 5-9 10-9s3-7 8-9" fill="none" stroke="#C9BDE6" stroke-width="3" stroke-linecap="round"/><circle cx="25" cy="7" r="2.6" fill="#E8BFA8"/></svg>`;
const ic=(d)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={home:ic('<path d="M3 11l9-8 9 8v10H3z"/>'),proj:ic('<path d="M3 7h18v13H3zM8 7V4h8v3"/>'),ai:ic('<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>'),task:ic('<path d="M9 11l3 3 8-8M4 5v14h16"/>'),net:ic('<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 15c3 0 6 1 6 5"/>'),fund:ic('<path d="M4 20h16M6 20V10M12 20V4M18 20v-7"/>'),set:ic('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'),chk:ic('<path d="M5 12l5 5 9-10"/>')};
const S={user:null,onb:0,tasks:[
{id:1,t:'مراجعة وصف المشروع',m:15,p:'عالية',done:false},{id:2,t:'تحديد العميلة المستهدفة',m:20,p:'عالية',done:false},{id:3,t:'مراجعة المصروفات الأولية',m:25,p:'متوسطة',done:false},{id:4,t:'مقارنة ثلاثة منافسين',m:30,p:'متوسطة',done:true}],
projects:[{id:1,n:'متجر لمسة — مشروع تجريبي',f:'منتجات منزلية',stage:'التحقق من السوق',pct:35,demo:true}],nid:10,flt:'الكل',avail:0};
const nav=[['dash','لوحة التحكم',I.home],['projects','مشاريعي',I.proj],['mentor','مستشارتي الذكية',I.ai],['feas','دراسة الجدوى',I.fund],['tasks','مهامي',I.task],['calendar','التقويم',I.chk],['network','شبكة الدعم',I.net],['advisors','دليل المستشارات',I.net],['funding','الاستعداد للتمويل',I.fund],['licenses','التراخيص والتأسيس',I.chk],['learn','مركز التعلم',I.proj],['notifications','الإشعارات',I.home],['settings','الإعدادات',I.set]];
function toast(m){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2400)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function route(){const h=cur().slice(2).split('/')[0]||'home';const app=['brief','validate','prep','start','dash','projects','mentor','feas','tasks','network','funding','settings','advisors','learn','licenses','calendar','notifications','help'];
if(app.includes(h)&&!S.user){go('#/login');return}
window.scrollTo(0,0);$('#root').innerHTML=app.includes(h)?shell(h):pub(h);if(P[h]&&P[h].init)P[h].init();schedSave();if(['services','how','about'].includes(h))setTimeout(()=>{const e=document.getElementById(h);e&&e.scrollIntoView()},0)}
function shell(h){const view=P[h]?P[h].view():soon();return`<div class="app"><aside class="side"><div class="logo" style="padding:8px 12px 16px">${Mark} HerPath</div>${nav.map(n=>`<a href="#/${n[0]}" class="${n[0]==h?'on':''}" ${n[0]==h?'aria-current="page"':''}>${n[2]}<span>${n[1]}</span></a>`).join('')}<a class="more" href="#/" onclick="S.user=null">${I.home}<span>تسجيل الخروج</span></a></aside><main class="main" id="main" tabindex="-1"><div class="note" role="status"><b>وضع تجريبي</b> — البيانات المعروضة توضيحية وليست بيانات منشأة حقيقية.</div>${view}</main></div>`}
function soon(){return`<div class="card" style="text-align:center;padding:40px"><h2>هذه الصفحة قيد البناء</h2><p class="mut">لم تُنفَّذ هذه الخدمة في النموذج الأولي بعد. يمكنك تجربة لوحة التحكم والمشاريع والمستشارة والمهام.</p><a class="btn" href="#/dash">العودة إلى لوحة التحكم</a></div>`}
const topbar=`<header class="top"><div class="wrap"><a class="logo" href="#/">${Mark} HerPath</a><nav aria-label="التنقل الرئيسي" onclick="this.classList.remove('open')"><a href="#/">الرئيسية</a><a href="#/services">خدماتنا</a><a href="#/how">كيف تعمل المنصة؟</a><a href="#/community">شبكة الدعم</a><a href="#/faq">الأسئلة الشائعة</a><a class="only-m" href="#/login">تسجيل الدخول</a></nav><a class="btn sec sm lg" href="#/login">تسجيل الدخول</a><a class="btn sm" href="#/signup">ابدئي رحلتك</a><button class="mb" aria-label="القائمة" onclick="document.querySelector('.top nav').classList.toggle('open')">☰</button></div></header><div id="main" tabindex="-1"></div>`;
const foot=`<footer class="alt sec-pad" style="padding:32px 0"><div class="wrap"><div class="logo" style="margin-bottom:8px">${Mark} HerPath</div><p class="mut" style="max-width:520px">حاضنة أعمال افتراضية مدعومة بالذكاء الاصطناعي، نموذج أولي للعرض. المنصة غير تابعة لأي جهة حكومية ولا تدّعي اعتمادًا رسميًا.</p><p style="margin:0 0 8px"><a class="flink" href="#/terms">الشروط والأحكام</a><a class="flink" href="#/privacy">سياسة الخصوصية</a><a class="flink" href="#/faq">الأسئلة الشائعة</a><a class="flink" href="#/community">شبكة الدعم</a></p><p class="mut" style="font-size:.85rem;margin:0">© 2026 HerPath. جميع الحقوق محفوظة.</p></div></footer>`;
const SV=[['المستشارة الذكية','حوّلي فكرتك إلى خطة مشروع واضحة، مع تحليل أولي للسوق ودراسة جدوى مبسطة.',I.ai],['مهام تناسب وقتك','قسّمي أهدافك إلى خطوات عملية قصيرة تستطيعين إنجازها خلال 15 إلى 30 دقيقة.',I.task],['شبكة الدعم المجتمعي','تواصلي مع رائدات أعمال ومستشارات، واكتشفي فرص التعاون والتعلم.',I.net],['الاستعداد للتمويل','نظّمي بياناتك المالية ومستنداتك، واستعدي للتقديم على برامج التمويل المناسبة.',I.fund]];
function pub(h){
if(h=='login'||h=='signup')return topbar+authForm(h);
if(h=='onboarding')return topbar+onboard();
if(['community','faq','terms','privacy'].includes(h))return topbar+pubPage(h)+foot;
if(!['home','services','how','about'].includes(h))return topbar+`<div class="wrap sec-pad" style="text-align:center"><h2>هذه الصفحة غير متاحة في النموذج الأولي</h2><a class="btn" href="#/">العودة إلى الرئيسية</a></div>`+foot;
return topbar+`<div class="wrap hero"><div><span class="badge">طريقك لريادة الأعمال، على طريقتك</span><h1 style="margin-top:14px">مشروعك يبدأ بخطوة… ونحن معك في كل خطوة.</h1><p class="mut" style="font-size:1.1rem">حوّلي فكرتك إلى مشروع واعد مع حاضنة أعمال ذكية تساعدك على التخطيط، وتنظيم وقتك، والاستعداد للتمويل، وبناء شبكة دعم تناسب طموحك وحياتك.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="#/signup">ابدئي مشروعك مجانًا</a><a class="btn sec" href="#/how">اكتشفي كيف تعمل HerPath</a></div><div style="margin-top:10px"><button class="btn sec" style="width:100%;max-width:420px" onclick="tourStart()">ابدئي العرض التجريبي</button></div><p class="mut" style="margin-top:16px;font-size:.9rem">خطوات صغيرة، إنجازات حقيقية، ومستقبل تصنعينه بطريقتك.</p></div>
<div class="mock" aria-label="معاينة توضيحية للوحة التحكم"><span class="badge demo">بيانات تجريبية</span><h3 style="margin-top:10px">متجر لمسة — مشروع تجريبي</h3><div class="prog"><i style="width:${progPct()}%"></i></div><p class="mut" style="font-size:.85rem">اكتمال الخطة <span class="num">${progPct()}%</span></p><div class="task"><span class="tt">تحديد العميلة المستهدفة</span><span class="badge"><span class="num">20</span> دقيقة</span></div><div class="task"><span class="tt">مراجعة المصروفات الأولية</span><span class="badge"><span class="num">25</span> دقيقة</span></div></div></div>
<section class="alt sec-pad"><div class="wrap"><h2>نعرف أن وقتك ثمين، وطموحك يستحق الفرصة.</h2><div class="grid g4" style="margin-top:20px">${[['لا أعرف من أين أبدأ','تقودك المستشارة من الفكرة إلى خطة بخطوات واضحة.'],['أخشى تكاليف التأسيس','تقدير أولي للتكاليف مع توضيح الافتراضات.'],['وقتي موزع بين مسؤوليات كثيرة','مهام من 15 دقيقة تتكيف مع يومك.'],['أحتاج إلى التوجيه والعلاقات','شبكة رائدات أعمال ومستشارات عن بُعد.']].map(c=>`<div class="card"><h3>${c[0]}</h3><p class="mut" style="margin:0">${c[1]}</p></div>`).join('')}</div></div></section>
<section class="sec-pad" id="services"><div class="wrap"><h2>خدماتنا الرئيسية</h2><div class="grid g4">${SV.map(s=>`<div class="card"><div style="color:var(--lav)">${s[2]}</div><h3>${s[0]}</h3><p class="mut">${s[1]}</p><a class="btn sec sm" href="#/signup">اكتشفي الخدمة</a></div>`).join('')}</div></div></section>
<section class="alt sec-pad" id="how"><div class="wrap"><h2 style="margin-bottom:28px">كيف تعمل HerPath؟</h2><div class="steps">${['عرّفي فكرتك','احصلي على خطتك','أنجزي مهامك بمرونة','طوّري مشروعك واستعدي للنمو'].map((s,i)=>`<div><b>${i+1}</b><p>${s}</p></div>`).join('')}</div></div></section>
<section class="sec-pad"><div class="wrap" style="max-width:720px"><h2>ليس عليكِ إنجاز كل شيء اليوم.</h2><p class="mut">مع HerPath، يمكنك التقدم في مشروعك خطوة بخطوة. حددي الوقت المتاح لك، ودعي المنصة تساعدك على تحويل الأهداف الكبيرة إلى مهام صغيرة واقعية.</p><div class="mock"><span class="badge demo">معاينة تجريبية</span>${[['كتابة وصف الجمهور المستهدف',20],['مقارنة ثلاثة منافسين',25],['تحديد الخطوة التالية',15]].map(t=>`<div class="task" style="margin-top:8px"><span class="tt">${t[0]}</span><span class="badge ok"><span class="num">${t[1]}</span> دقيقة</span></div>`).join('')}</div></div></section>
<section class="alt sec-pad" id="about"><div class="wrap"><h2>فرص أكبر، من كل منطقة في المملكة.</h2><p class="mut" style="max-width:640px">نسعى إلى تعزيز المشاركة الاقتصادية للمرأة، ودعم المشاريع المنزلية والصغيرة، وتقليل حواجز المكان والوقت، بما ينسجم عمومًا مع مستهدفات رؤية 2030. لا نزعم شراكة أو اعتمادًا رسميًا، ولا نعرض أرقامًا لم تتحقق.</p></div></section>

function toggle(id){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;route();if(t.done)toast('أحسنتِ، خطوة جديدة أُنجزت')}
function del(id){S.tasks=S.tasks.filter(t=>t.id!=id);route()}
function mv(id,d){const i=S.tasks.findIndex(t=>t.id==id),j=i+d;if(j<0||j>=S.tasks.length)return;[S.tasks[i],S.tasks[j]]=[S.tasks[j],S.tasks[i]];route()}

function plan(av){let s=0,o=[];S.tasks.filter(t=>!t.done).forEach(t=>{if(s+t.m<=av){s+=t.m;o.push(esc(t.t)+' ('+t.m+' د)')}});return o.length?o.join('، '):'لا توجد مهمة تناسب هذا الوقت، جرّبي وقتًا أطول أو قسّمي مهمة.'}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.append(m);const f=m.querySelector('input,select,textarea');if(f)f.focus();return m}

async function askAI(prompt,btn){const o=$('#aio');o.style.display='block';o.innerHTML='<span class="badge">جارٍ التحليل…</span><div style="white-space:pre-wrap;margin-top:8px"></div>';const t=o.lastChild;btn&&(btn.disabled=true);try{if(!(window.claude&&claude.use))throw{code:'na'};const sm=await claude.use('sample');if(!sm)throw{code:'na'};const r=await sm(SYS+'\n\n'+prompt,{cache:false,onText:x=>{t.textContent=x.text}});t.textContent=r.text;o.firstChild.className='badge ok';o.firstChild.textContent='مولَّد بالذكاء الاصطناعي — يحتاج مراجعتك'}catch(e){o.firstChild.className='badge demo';o.firstChild.textContent='تعذّر التحليل';t.textContent=e.code=='na'||e.code=='not_granted'?'خدمة الذكاء الاصطناعي غير متاحة هنا أو لم تُمنح الموافقة.':e.code=='rate_limited'?'بلغتِ حد الاستخدام مؤقتًا. حاولي لاحقًا.':'تعذر الاتصال بالخدمة. حاولي مرة أخرى.'}finally{btn&&(btn.disabled=false)}}

const FL=[['price','سعر البيع للوحدة (ر.س)'],['units','الوحدات المتوقع بيعها شهريًا'],['vc','التكلفة المتغيرة للوحدة (ر.س)'],['fixed','التكاليف الثابتة الشهرية (ر.س)'],['setup','تكاليف التأسيس (ر.س)'],['cons','السيناريو المتحفظ (% من المبيعات الأساسية)'],['opt','السيناريو المتفائل (% من المبيعات الأساسية)']];
function calc(m){const f=S.f,u=f.units*m,c=f.price-f.vc;return{u,c,rev:u*f.price,op:u*c-f.fixed}}
function recs(){const f=S.f,b=calc(1),be=b.c>0?Math.ceil(f.fixed/b.c):null,r=[];if(b.c<=0)r.push(['راجعي سعر البيع أو التكلفة المتغيرة','هامش المساهمة غير موجب: كل وحدة تُباع لا تغطي تكلفتها.']);else if(be>f.units)r.push(['خفّضي التكاليف الثابتة أو اختبري سعرًا أعلى','نقطة التعادل ('+be+' وحدة) أعلى من مبيعاتك المتوقعة ('+f.units+').']);r.push(['تحققي من الطلب قبل شراء مخزون كبير','أرقام المبيعات افتراضات منك ولم تُختبر مع عملاء بعد. درجة عدم اليقين عالية.']);r.push(['اطلبي عروض أسعار من موردَين أو أكثر','التكلفة المتغيرة تؤثر مباشرة على هامش المساهمة.']);return r}

$('#fo').innerHTML=`<div class="grid g4" style="margin-bottom:16px">${[['هامش المساهمة للوحدة',M(b.c),'سعر البيع − التكلفة المتغيرة'],['نقطة التعادل',be?`<span class="num">${be}</span> وحدة شهريًا`:'غير محسوبة','الثابتة ÷ هامش المساهمة'+(be?'':' (الهامش غير موجب)')],['الإيرادات الشهرية',M(b.rev),'الوحدات × سعر البيع'],['الربح التشغيلي الشهري',M(b.op),'الإيرادات − المتغيرة − الثابتة'],['استرداد التأسيس',b.op>0?`<span class="num">${Math.ceil(f.setup/b.op)}</span> شهرًا`:'غير محسوب','التأسيس ÷ الربح الشهري']].map(s=>`<div class="card"><div class="mut" style="font-size:.9rem">${s[0]}</div><b style="font-size:1.25rem;color:var(--plum)">${s[1]}</b><div class="mut" style="font-size:.8rem">${s[2]}</div></div>`).join('')}</div><div class="card" style="margin-bottom:16px"><h3>السيناريوهات <span class="badge demo">افتراضات قابلة للتعديل</span></h3>${sc.map(s=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${s.n}</b><span><span class="num">${Math.round(s.u)}</span> وحدة · الربح ${M(s.op)} ${s.op<0?'(خسارة)':''}</span></div><div class="prog"><i style="width:${Math.abs(s.op)/mx*100}%;background:${s.op<0?'var(--err)':'var(--sage)'}"></i></div></div>`).join('')}</div><div class="card"><h3>ماذا أنصحك أن تفعلي الآن؟</h3>${rc.map((r,i)=>`<div class="task"><span class="tt"><b>${r[0]}</b><br><small class="mut">السبب: ${r[1]}</small></span><button class="btn sm" onclick="recTask(${i})">حوّلي إلى مهمة</button></div>`).join('')}<p class="mut" style="font-size:.85rem;margin:0">هذه اقتراحات غير إلزامية مبنية على مدخلاتك فقط.</p></div>`}

async function aiReal(p,on){const T=28000;if(HERPATH_API){const c=new AbortController(),tm=setTimeout(()=>c.abort(),T);try{const r=await fetch(HERPATH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p}),signal:c.signal});if(r.status==429)throw{code:'rate_limited'};if(!r.ok)throw{code:'http'};return (await r.json()).text}catch(e){if(e.name=='AbortError')throw{code:'timeout'};throw e.code?e:{code:'net'}}finally{clearTimeout(tm)}}

function chatRender(){const el=$('#chat');if(!el)return;el.innerHTML=(S.chat.length?S.chat.map((m,i)=>m.r=='u'?`<div class="task" style="background:var(--soft)"><span class="tt"><small class="mut">أنتِ</small><br>${esc(m.t)}</span></div>`:m.r=='e'?`<div class="note" role="alert">${esc(m.t)}</div>`:`<div class="task" style="display:block"><small class="mut">${m.demo?'مستشارتي الذكية · نتيجة تجريبية وليست تحليلًا حقيقيًا':'مستشارتي الذكية · مولَّد بالذكاء الاصطناعي'}</small><div style="white-space:pre-wrap;margin:6px 0">${esc(m.t)}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm sec" onclick="saveRes(${i})">حفظ النتيجة في المشروع</button><button class="btn sm sec" onclick="toTasks(${i})">تحويل التوصية إلى مهام</button><button class="btn sm sec" onclick="human(${i})">أحتاج إلى رأي مستشارة بشرية</button></div></div>`).join(''):'<p class="mut">ابدئي بسؤال أو اختاري اقتراحًا.</p>')+(S.busy?`<div class="task" role="status"><span class="tt" style="white-space:pre-wrap">${S.live?esc(S.live):'جارٍ توليد الرد…'}</span></div>`:'')}
async function sendQ(t){t=(t||'').trim();if(!t){toast('اكتبي سؤالك أولًا');return}if(S.busy)return;S.chat.push({r:'u',t});S.busy=true;S.live='';chatRender();const hist=S.chat.filter(m=>m.r!='e').slice(-7,-1).map(m=>(m.r=='u'?'المستخدمة: ':'المستشارة: ')+m.t).join('\n');try{const r=await aiCall(SYS+'\n\nالسياق:\n'+ctxText(t)+'\n\nالمحادثة السابقة:\n'+hist+'\n\nالسؤال: '+t,x=>{S.live=x;chatRender()});S.chat.push({r:'a',t:r,demo:LASTDEMO})}catch(e){S.chat.push({r:'e',t:aiErr(e)})}finally{S.busy=false;S.live='';if(S.chat.length>40)S.chat=S.chat.slice(-40);chatRender();schedSave()}}
function saveRes(i){const p=S.projects[S.pi];if(!p){toast('أنشئي مشروعًا أولًا لحفظ النتيجة فيه');return}S.res.push({p:p.n,t:S.chat[i].t,d:today(),id:S.nid++});saveNow('تم حفظ النتيجة في المشروع').then(()=>route())}
function toTasks(i){const L=S.chat[i].t.split('\n').map(l=>l.trim()).filter(l=>/^([-•*]|\d+[.)])\s/.test(l)).map(l=>l.replace(/^([-•*]|\d+[.)])\s*/,'')).slice(0,5);if(!L.length){toast('لا توجد خطوات قابلة للتحويل في هذا الرد');return}L.forEach(l=>{const m=l.match(/^(.+?)\s*\|\s*(\d+)/);S.tasks.push({id:S.nid++,t:(m?m[1]:l).replace(/\*\*/g,'').slice(0,90),m:m?Math.min(60,+m[2]):20,p:'متوسطة',done:false})});schedSave();toast('أُضيفت '+L.length+' مهام إلى مهامي')}
function human(i){let q='';for(let j=i-1;j>=0;j--)if(S.chat[j].r=='u'){q=S.chat[j].t;break}const p=S.projects[S.pi];S.humanTopic=((p?p.f:'')+' — '+q).slice(0,120);go('#/advisors')}

توجد بيانات موثقة.</p><button class="btn sm" onclick="reqS('${x.s}')">طلب جلسة</button></div>`).join('')}</div>`:a.demo?'<div class="card" style="text-align:center"><h3>لا توجد نتائج</h3><p class="mut">غيّري البحث أو التخصص.</p></div>':'<div class="card" style="text-align:center;padding:36px"><h3>نعمل على بناء شبكة المستشارات</h3><p class="mut">ستتمكنين هنا من استكشاف الملفات المهنية للمستشارات وطلب الجلسات عند توفرهن.</p></div>'}<h3 style="margin-top:20px">طلباتي</h3>${S.sess.length?S.sess.map(s=>`<div class="task"><span class="tt">${esc(s.t||s)}<br><small class="mut">${esc(s.sp||'')}</small></span><span class="badge demo">${esc(s.st||'مسودة محلية')}</span></div>`).join(''):'<p class="mut">لا توجد طلبات بعد.</p>'}`}};

function demoReply(prompt){const q=prompt.split('السؤال: ').pop(),pr=S.projects[S.pi]||{n:'مشروعك',f:'مجالك',stage:'الفكرة'},f=S.f,b=calc(1),be=b.c>0?Math.ceil(f.fixed/b.c)+' وحدة':'غير محسوبة';
if(/5 مهام|مهام صغيرة/.test(q))return `مهام مقترحة لـ «${pr.n}» (مثال تجريبي):\n- كتابة وصف العميلة المثالية | 20\n- مقارنة ثلاثة منافسين في الأسعار | 25\n- حساب تكلفة الوحدة الواحدة | 30\n- إجراء ثلاث مقابلات قصيرة مع عميلات محتملات | 30\n- تحديد الخطوة التالية | 15`;
if(/خطة عمل/.test(q))return `خطة 30 يومًا لـ «${pr.n}» (قالب تجريبي):\n- الأسبوع 1: تحديد العميلة والمشكلة ومقابلة 3 عميلات محتملات | 30\n- الأسبوع 2: جمع عروض أسعار وحساب التكاليف في دراسة الجدوى | 30\n- الأسبوع 3: تجهيز منتج تجريبي صغير واختبار السعر | 25\n- الأسبوع 4: مراجعة النتائج وتحديد المرحلة التالية | 20\nتنبيه: خطة عامة دون بيانات سوق.`;
if(/جدوى|هامش المساهمة/.test(q))return `٣ أقسام منفصلة (نتيجة تجريبية):\n\n(1) مدخلات من المستخدمة\n- ${pr.n} (${pr.f})، سعر البيع ${f.price}، ${f.units} وحدة شهريًا، تكلفة الوحدة ${f.vc}، ثابتة ${f.fixed} ريال شهريًا\n\n(2) افتراضات توضيحية\n- ثبات الأسعار والتكاليف وتحقق المبيعات كما أدخلتِ\n\n(3) بيانات موثقة\n- لا توجد مصادر متصلة\n\n(4) ما يحتاج تحققًا\n- الطلب الفعلي، أسعار المنافسين، أي رسوم نظامية\n\nحسابات من أرقامك: هامش الوحدة ${b.c} ريال، نقطة التعادل ${be}، الربح الشهري ${Math.round(b.op)} ريال.`;
if(/تحليل|فكرة/.test(q))return `تحليل أولي لـ «${pr.n}» (قالب تجريبي):\n- المجال: ${pr.f}، المرحلة: ${pr.stage}\n- المشكلة المحتملة: قلة منتجات منزلية بجودة ثابتة (فرضية تحتاج تحققًا)\n- المخاطر: تقلب الطلب، ضيق الوقت، تكاليف غير محسوبة\n- أسئلة للتحقق: من هي العميلة؟ كم تدفع؟ من المنافس؟\nلا أرقام سوق متصلة هنا.`;
return `الخطوة التالية المقترحة لـ «${pr.n}» (نتيجة تجريبية):\n- حددي عميلتك المستهدفة في 20 دقيقة | 20\n- أجري مقابلة قصيرة واحدة مع عميلة محتملة | 30`}

function editProj(id){const p=S.projects.find(x=>x.id==id),m=modal(`<h3>تعديل المشروع</h3><div class="fld"><label for="pn">اسم المشروع</label><input id="pn" value="${esc(p.n)}"></div><div class="fld"><label for="pf">المجال</label><input id="pf" value="${esc(p.f)}"></div><div class="fld"><label for="pd">وصف مختصر</label><textarea id="pd">${esc(p.desc||'')}</textarea></div><div class="err" id="pe" role="alert"></div><button class="btn" id="ok">حفظ</button> <button class="btn sec" onclick="this.closest('.modal').remove()">إلغاء</button>`);m.querySelector('#ok').onclick=()=>{const n=m.querySelector('#pn').value.trim();if(!n){m.querySelector('#pe').textContent='اسم المشروع مطلوب.';return}p.n=n;p.f=m.querySelector('#pf').value.trim()||p.f;p.desc=m.querySelector('#pd').value.trim();m.remove();route();saveNow('تم حفظ التعديل')}}
function delProj(id){const m=modal(`<h3>حذف المشروع؟</h3><p class="mut">لا يمكن التراجع عن هذا الإجراء.</p><button class="btn dng" id="ok">نعم، احذفي</button> <button class="btn sec" onclick="this.closest('.modal').remove()">تراجع</button>`);m.querySelector('#ok').onclick=()=>{S.projects=S.projects.filter(p=>p.id!=id);S.pi=Math.min(S.pi,Math.max(0,S.projects.length-1));m.remove();schedSave();route();toast('تم حذف المشروع')}}
function openProj(id){const p=S.projects.find(x=>x.id==id),act=S.projects.indexOf(p)==S.pi,pr=progress(),c="this.closest('.modal').remove()";modal(`<h3>${esc(p.n)}</h3><p class="mut">${esc(p.f)}${p.desc?' · '+esc(p.desc):''}</p>${act&&pr?`<p>اكتمال الخطة <span class="num">${pr.pct}%</span></p>`:'<p class="mut">فعّلي المشروع لعرض تقدمه.</p>'}<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm" href="#/mentor" onclick="S.pi=${S.projects.indexOf(p)};${c}">مستشارتي الذكية</a><a class="btn sm sec" href="#/feas" onclick="${c}">دراسة الجدوى</a><a class="btn sm sec" href="#/tasks" onclick="${c}">المهام</a><a class="btn sm sec" href="#/funding" onclick="${c}">التمويل</a><button class="btn sm sec" onclick="${c}">إغلاق</button></div>`)}

P.settings={view(){return H('الإعدادات','إعدادات هذا النموذج التجريبي.')+`<div class="card" style="margin-top:12px"><div class="fld"><label for="sn">الاسم</label><input id="sn" value="${esc(S.user.name)}"></div><button class="btn" onclick="S.user.name=$('#sn').value.trim()||S.user.name;saveNow('تم تحديث الاسم').then(()=>route())">حفظ الاسم</button></div><div class="card" style="margin-top:12px"><h3>الخصوصية في النسخة التجريبية</h3><label style="display:flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" ${S.useF?'checked':''} onchange="S.useF=this.checked;schedSave()">إرفاق أرقام دراسة الجدوى بأسئلة مستشارتي الذكية افتراضيًا</label><ul class="mut"><li>بياناتك محفوظة في هذا المتصفح فقط، ولا تُزامَن بين الأجهزة ولا تُرسل إلى خادم تابع لـ HerPath.</li><li>عند استخدام الذكاء الاصطناعي تُرسل المعلومات الظاهرة لك تحت «ما يُرسل مع سؤالك» فقط.</li><li>لا يوجد تشفير ولا مصادقة حقيقية في هذا النموذج.</li><li>شبكة الدعم محلية ولا يراها أحد غيرك.</li></ul><a href="#/privacy" style="text-decoration:underline">سياسة الخصوصية</a></div><div class="card" style="margin-top:12px"><h3>التجربة التجريبية</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="tourStart()">إعادة الجولة التجريبية</button><button class="btn dng" onclick="resetDemo()">إعادة ضبط التجربة</button></div></div>`}};

/* ===== assistant: replies, chat, task conversion ===== */
const capM=m=>/أقل من 30/.test(S.st.time||'')?Math.min(m,20):m;
function demoReply(prompt){const q=prompt.split('السؤال: ').pop(),pr=S.projects[S.pi]||{n:'مشروعك',f:'مجالك'},f=S.f,b=calc(1),mg=f.price?Math.round(b.c/f.price*100):0,be=b.c>0?Math.ceil(f.fixed/b.c):null,nm='«'+pr.n+'»';
const out=(sum,rec,next,tasks,extra)=>`الخلاصة: ${sum}\n\nالتوصية: ${rec}\n\nالخطوة التالية: ${next}\n${extra?'\n'+extra+'\n':''}\nمهام مقترحة:\n${tasks.map(t=>'- '+t[0]+' | '+capM(t[1])).join('\n')}\n\n(نتيجة تجريبية مبنية على بياناتك المدخلة فقط، وليست تحليلًا حقيقيًا ولا بيانات سوق.)`;
if(/5 مهام|مهام صغيرة/.test(q))return out('قسّمتُ أقرب هدف لـ'+nm+' إلى خطوات صغيرة.','ابدئي بأقصرها اليوم.','أنجزي المهمة الأولى.',[['كتابة وصف العميلة المثالية',20],['مقارنة ثلاثة منافسين في الأسعار',25],['حساب تكلفة الوحدة الواحدة',30],['إجراء مقابلة قصيرة مع عميلة محتملة',30],['تحديد الخطوة التالية',15]]);
if(/خطة عمل/.test(q))return out('خطة 30 يومًا لـ'+nm+' بخطوات صغيرة.','وزّعي العمل على أربعة أسابيع بحسب وقتك.','ابدئي بالأسبوع الأول.',[['الأسبوع 1: تحديد العميلة والمشكلة',30],['الأسبوع 2: جمع عرضي سعر وحساب التكاليف',30],['الأسبوع 3: اختبار السعر مع ثلاث عميلات',25],['الأسبوع 4: مراجعة النتائج وتحديد المرحلة التالية',20]],'خطة عامة دون بيانات سوق.');
if(/دراسة جدوى|هامش المساهمة/.test(q)){return `الخلاصة: بأرقامك الحالية يبلغ هامش الوحدة ${b.c} ريال، والربح التشغيلي الشهري ${Math.round(b.op)} ريال.\n\nالتوصية: اختبري افتراض المبيعات (${f.units} وحدة) مع عميلات حقيقيات قبل الاعتماد عليه.\n\nالخطوة التالية: راجعي صفحة دراسة الجدوى وعدّلي الأرقام.\n\n(1) مدخلات منكِ\n- ${pr.n} (${pr.f})، سعر البيع ${f.price}، ${f.units} وحدة شهريًا، تكلفة الوحدة ${f.vc}، ثابتة ${f.fixed} ريال شهريًا\n\n(2) افتراضات توضيحية\n- ثبات الأسعار والتكاليف وتحقق المبيعات كما أدخلتِ\n\n(3) بيانات موثقة\n- لا توجد مصادر متصلة\n\n(4) ما يحتاج تحققًا\n- الطلب الفعلي، أسعار المنافسين، أي رسوم أو ضرائب منطبقة\n\nنقطة التعادل: ${be?be+' وحدة شهريًا':'غير محسوبة (الهامش غير موجب)'}.\n\nمهام مقترحة:\n- التحقق من الطلب مع عميلات محتملات | ${capM(30)}\n- مراجعة افتراضات الجدوى | ${capM(20)}\n\n(نتيجة تجريبية وليست تحليلًا حقيقيًا.)`}
if(/حلّلي فكرة|تحليل/.test(q))return out('أنتِ في مرحلة بناء '+nm+' في مجال '+pr.f+'.','حدّدي العميلة التي تواجه المشكلة بوضوح قبل أي توسع.','اكتبي المشكلة التي يحلها مشروعك في جملتين.',[['كتابة المشكلة وعرض القيمة',20],['تحديد ثلاثة أسئلة للتحقق',20],['مقابلة عميلة محتملة',30]],'المخاطر: تقلب الطلب، ضيق الوقت، تكاليف لم تُحسب بعد. أسئلة تحتاج تحققًا: من تدفع؟ وكم؟ ولماذا؟');
if(/التكاليف|التسعير|سعر|التكلفة/.test(q)){const up=Math.round(f.price*1.1);return out(`هامشك ${b.c} ريال للوحدة (${mg}% من السعر ${f.price})، ونقطة التعادل ${be?be+' وحدة':'غير محسوبة'}.`,be&&be>f.units?`تكاليفك الثابتة تتطلب ${be} وحدة للتعادل، وهي أعلى من ${f.units} المتوقعة؛ راجعي الثابتة أو السعر.`:'حافظي على الهامش، وجرّبي سعرًا مختلفًا مع عميلات قبل اعتماده.','قارني عرضي سعر لخفض تكلفة الوحدة.',[['جمع عرضي سعر من موردين',25],['اختبار سعرين مع ثلاث عميلات',30],['مراجعة التكاليف الثابتة الشهرية',20]],`تجربة سعرية: رفع السعر 10% إلى ${up} ريال يجعل الهامش ${up-f.vc} ريال، مع احتمال تراجع المبيعات. هذا حساب من أرقامك لا توقع سوق.`)}
if(/عملاء|العميلة|الطلب/.test(q))return out('قبل التوسع، تحققي ممن سيدفع ولماذا.','قابلي ثلاث عميلات محتملات واسأليهن عن آخر مرة احتجن فيها لمنتج مثل منتجك.','اكتبي وصف العميلة المثالية.',[['كتابة وصف العميلة المثالية',20],['كتابة 5 أسئلة مقابلة',25],['مقابلة عميلة محتملة واحدة',30]],'أسئلة مقترحة: كيف تحلين هذه الحاجة الآن؟ ما الذي لا يعجبك؟ كم تدفعين عادة؟ اسمعي الأرقام من العميلات لا من الافتراضات. بعد المقابلات أكّدي التحقق من «رحلة مشروعك».');
if(/تأسيس|ترخيص|تراخيص|السجل/.test(q))return out('خطوات التأسيس تختلف بحسب نشاطك ومكانه ونوع المنشأة، ولا أستطيع تحديد ما ينطبق عليك أو الرسوم.','أجيبي أسئلة «التراخيص والتأسيس» لإنشاء مسار إرشادي ثم تحققي من كل خطوة في المصدر الرسمي.','افتحي صفحة التراخيص والتأسيس.',[['الإجابة عن أسئلة مسار التأسيس',15],['فتح مصدر رسمي لخطوة وتسجيل ملاحظاتك',20]],'لا تحتوي هذه النتيجة رسومًا أو مددًا أو شروطًا نظامية.');
if(/الخطوة التالية|ماذا بعد/.test(q)){const ns=nextStageInfo();return out('بحسب حالة مشروعك الآن'+(ns[2]?'، المرحلة الأقرب هي «'+ns[2]+'»':'')+'.',ns[0]+'.','افتحي الصفحة المرتبطة بهذه المرحلة.',[[ns[0],20]])}
return out('لم أتعرف على موضوع سؤالك بدقة.','جرّبي أحد المسارات: التكاليف والتسعير، العملاء والتحقق من الطلب، التأسيس، أو الخطوة التالية.','اختاري سؤالًا مقترحًا.',[['تحديد سؤال واضح للمستشارة',15]])}
function lockAsk(){document.querySelectorAll('.askbtn').forEach(b=>b.disabled=!!S.busy)}
async function sendQ(t){t=(t||'').trim();if(!t){toast('اكتبي سؤالك أولًا');return false}if(S.busy){toast('جارٍ توليد رد سابق… انتظري حتى يكتمل');return false}S.chat.push({r:'u',t,ctx:ctxSent(t)});S.busy=true;S.live='';chatRender();lockAsk();const hist=S.chat.filter(m=>m.r!='e').slice(-7,-1).map(m=>(m.r=='u'?'المستخدمة: ':'المستشارة: ')+m.t).join('\n');let ok=true;try{const r=await aiCall(SYS+'\n\nالسياق:\n'+ctxText(t)+'\n\nالمحادثة السابقة:\n'+hist+'\n\nالسؤال: '+t,x=>{S.live=x;chatRender()});S.chat.push({r:'a',t:r,demo:LASTDEMO})}catch(e){ok=false;S.chat.push({r:'e',t:aiErr(e)})}finally{S.busy=false;S.live='';if(S.chat.length>40)S.chat=S.chat.slice(-40);chatRender();lockAsk();schedSave()}return ok}
P.mentor={view(){const p=S.projects;return H('مستشارتي الذكية','مساعدك الذكي لتحليل فكرتك، وتخطيط مشروعك، وفهم خطواتك القادمة.')+`<div class="note" style="margin-top:12px">عند توفر الاتصال تكون الردود مولَّدة بالذكاء الاصطناعي وقد تخطئ؛ وعند عدم توفره تظهر نتائج تجريبية جاهزة موسومة بوضوح. ليست رأيًا مهنيًا ولا ماليًا ولا قانونيًا ولا تتضمن بيانات سوق موثقة. للقرارات المهمة اطلبي رأي مستشارة بشرية من <a href="#/advisors" style="text-decoration:underline">دليل المستشارات</a>.</div><div class="card" style="margin-bottom:12px"><div class="grid g2"><div><label for="pj">المشروع</label><select id="pj" onchange="S.pi=+this.value;route()">${p.length?p.map((x,i)=>`<option value="${i}" ${i==S.pi?'selected':''}>${esc(x.n)}</option>`).join(''):'<option>لا يوجد مشروع</option>'}</select></div><div><b>ملخص المشروع المستخدم في التحليل:</b><div class="mut" style="font-size:.9rem;white-space:pre-line">${esc(ctxText())}</div><label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:6px"><input type="checkbox" ${S.useF?'checked':''} onchange="S.useF=this.checked;schedSave();route()">إرفاق أرقام دراسة الجدوى</label></div></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${ACT.map((a,i)=>`<button class="btn sm askbtn" onclick="sendQ(ACT[${i}][1])">${a[0]}</button>`).join('')}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${QS.map((q,i)=>`<button class="btn sm sec askbtn" onclick="sendQ(QS[${i}])">${q}</button>`).join('')}</div><div id="chat" class="card" style="min-height:140px" aria-live="polite"></div><div class="card" style="margin-top:12px"><label for="q">اكتبي فكرة مشروعك أو سؤالك هنا...</label><textarea id="q"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn askbtn" onclick="const v=$('#q').value;if(v.trim()){$('#q').value=''}sendQ(v)">إرسال</button><button class="btn sec" onclick="S.chat=[];schedSave();route()">مسح المحادثة</button></div></div><h3 style="margin-top:20px">النتائج المحفوظة في المشروع</h3>${S.res.length?S.res.map((r,i)=>`<div class="task"><span class="tt">${esc(r.p)} · <span class="num">${r.d}</span><br><small class="mut">${esc(r.t.slice(0,80))}…</small></span><button class="btn sm sec" onclick="showRes(${i})">فتح</button><button class="btn dng sm" onclick="S.res.splice(${i},1);saveNow('تم حذف النتيجة').then(()=>route())">حذف</button></div>`).join(''):'<p class="mut">لا توجد نتائج محفوظة بعد.</p>'}`},init(){chatRender();lockAsk()}};
function showRes(i){const r=S.res[i];modal(`<h3>${esc(r.p)}</h3><div style="white-space:pre-wrap">${esc(r.t)}</div><button class="btn sec" style="margin-top:10px" onclick="this.closest('.modal').remove()">إغلاق</button>`)}
function chatRender(){const el=$('#chat');if(!el)return;el.innerHTML=(S.chat.length?S.chat.map((m,i)=>m.r=='u'?`<div class="task" style="background:var(--soft)"><span class="tt"><small class="mut">أنتِ</small><br>${esc(m.t)}</span></div>`:m.r=='e'?`<div class="note" role="alert">${esc(m.t)}</div>`:`<div class="task" style="display:block"><small class="mut">مستشارتي الذكية · ${m.demo?'نتيجة تجريبية وليست تحليلًا حقيقيًا':'مولَّد بالذكاء الاصطناعي'}</small><div style="white-space:pre-wrap;margin:6px 0">${esc(m.t)}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm sec" onclick="saveRes(${i})">حفظ النتيجة في المشروع</button><button class="btn sm sec" onclick="openTaskModal(${i})">تحويل التوصية إلى مهمة</button><button class="btn sm sec" onclick="human(${i})">أحتاج إلى رأي مستشارة بشرية</button></div></div>`).join(''):'<p class="mut">ابدئي بسؤال أو اختاري اقتراحًا.</p>')+(S.busy?`<div class="task" role="status"><span class="tt" style="white-space:pre-wrap">${S.live?esc(S.live):'جارٍ توليد الرد…'}</span></div>`:'')}
function parseRecs(i){return S.chat[i].t.split('\n').map(l=>l.trim()).filter(l=>/^([-•*]|\d+[.)])\s/.test(l)).map(l=>l.replace(/^([-•*]|\d+[.)])\s*/,'').replace(/\*\*/g,'')).slice(0,5).map(l=>{const m=l.match(/^(.+?)\s*\|\s*(\d+)/);return{t:(m?m[1]:l).slice(0,90),m:m?+m[2]:20}})}
function openTaskModal(i,items){const L=items||parseRecs(i);if(!L.length){toast('لا توجد خطوات قابلة للتحويل في هذا الرد');return}const dur=[15,20,25,30,45,60];

const m=modal(`<h3>تحويل التوصية إلى مهام</h3><p class="mut">راجعي العناوين والمواعيد. لن تُضاف مهمة إلى التقويم قبل تأكيدك.</p>${rows}<div class="err" id="tke" role="alert"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="tkok">تأكيد وإضافة إلى المهام والتقويم</button><button class="btn sec" id="tkx">إلغاء</button></div>`);

m.querySelector('#tkok').onclick=function(){const err=t=>{m.querySelector('#tke').textContent=t},rs=[...m.querySelectorAll('.tkrow')].filter(r=>r.querySelector('.tk-on').checked);if(!rs.length){err('اختاري مهمة واحدة على الأقل.');return}for(const r of rs){if(!r.querySelector('.tk-t').value.trim()){err('اكتبي عنوانًا لكل مهمة مختارة.');return}const d=r.querySelector('.tk-z').value;if(!d||d<today()){err('اختاري تاريخًا صحيحًا لا يسبق اليوم.');return}}
this.disabled=true;let add=0,skip=0;rs.forEach(r=>{const t=r.querySelector('.tk-t').value.trim(),d=r.querySelector('.tk-z').value,key=t.replace(/\s+/g,' ')+'|'+d;if(S.made[key]&&S.tasks.some(x=>x.id==S.made[key])){skip++;return}const id=S.nid++;S.tasks.push({id,t,desc:r.querySelector('.tk-d').value.trim(),m:+r.querySelector('.tk-m').value,p:r.dataset.p||'متوسطة',src:r.dataset.src||undefined,done:false,d});S.made[key]=id;add++});

/* ===== feasibility chart ===== */
function niceTicks(mn,mx){const span=(mx-mn)||1,raw=span/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag,step=(n<=1?1:n<=2?2:n<=5?5:10)*mag,lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step,t=[];for(let v=lo;v<=hi+step/1000;v+=step)t.push(Math.round(v));return t}
const num=n=>Math.round(n).toLocaleString('en-US');
function scChart(sc){const W=340,L0=12,R0=12,pw=W-L0-R0,gh=58,top=8,rows=sc.map(s=>[s.n,[[s.rev,'rev'],[s.u*S.f.vc+S.f.fixed,'cost'],[s.op,s.op<0?'neg':'pos']]]),all=rows.flatMap(r=>r[1].map(x=>x[0])),tk=niceTicks(Math.min(0,...all),Math.max(0,...all)),lo=tk[0],hi=tk[tk.length-1],X=v=>L0+(v-lo)/((hi-lo)||1)*pw,HH=top+rows.length*gh+26;
let g=`<defs><pattern id="pc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--plum)"/><rect width="3" height="6" fill="var(--card)" opacity=".35"/></pattern><pattern id="pn" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="var(--err)"/><rect width="3" height="6" fill="var(--card)" opacity=".45"/></pattern></defs>`;
tk.forEach(v=>{g+=`<line x1="${X(v)}" y1="${top}" x2="${X(v)}" y2="${HH-22}" stroke="var(--bd)"/><text x="${X(v)}" y="${HH-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${num(v)}</text>`});
g+=`<line x1="${X(0)}" y1="${top}" x2="${X(0)}" y2="${HH-22}" stroke="var(--ink)" stroke-width="1.5"/>`;
rows.forEach((r,i)=>{const y0=top+i*gh;g+=`<text x="${W-R0}" y="${y0+11}" font-size="12" font-weight="700" text-anchor="end" fill="var(--plum)">${r[0]}</text>`;r[1].forEach((b,j)=>{const y=y0+16+j*14,x0=X(0),x1=X(b[0]),x=Math.min(x0,x1),w=Math.max(Math.abs(x1-x0),1.5),fill=b[1]=='rev'?'var(--lav)':b[1]=='cost'?'url(#pc)':b[1]=='neg'?'url(#pn)':'var(--sage)',lab=num(b[0]),lw=lab.length*6+6,pos=b[0]>=0,fit=pos?x1+lw<W:x1-lw>0;g+=`<rect x="${x}" y="${y}" width="${w}" height="11" fill="${fill}" rx="2"/><text x="${pos?(fit?x1+3:x1-3):(fit?x1-3:x1+3)}" y="${y+9}" font-size="10" text-anchor="${pos?(fit?'start':'end'):(fit?'end':'start')}" fill="${fit?'var(--ink)':'#fff'}">${lab}</text>`})});
const sw=(f,t)=>`<span style="display:inline-flex;align-items:center;gap:6px"><svg width="16" height="12" aria-hidden="true"><rect width="16" height="12" rx="2" fill="${f}"/></svg>${t}</span>`;
return`<svg viewBox="0 0 ${W} ${HH}" role="img" aria-label="رسم بياني أفقي للإيرادات والتكاليف والربح أو الخسارة في ثلاثة سيناريوهات، والقيم في الجدول أسفله" style="width:100%;height:auto;direction:ltr">${g}</svg><div style="display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem"><svg width="0" height="0" aria-hidden="true"><defs><pattern id="lc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--plum)"/><rect width="3" height="6" fill="var(--card)" opacity=".35"/></pattern><pattern id="ln" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="var(--err)"/><rect width="3" height="6" fill="var(--card)" opacity=".45"/></pattern></defs></svg>${sw('var(--lav)','الإيرادات')}${sw('url(#lc)','التكاليف (متغيرة + ثابتة)')}${sw('var(--sage)','الربح')}${sw('url(#ln)','الخسارة (يسار الصفر)')}</div><p class="mut" style="font-size:.85rem;margin:6px 0">المحور الأفقي: القيمة الشهرية بالريال (ر.س). الخط الداكن هو الصفر، والقيم السالبة تقع على يساره.</p>`}
function feasOut(){const f=S.f,b=calc(1),be=b.c>0?Math.ceil(f.fixed/b.c):null,sc=[['متحفظ',f.cons/100],['أساسي',1],['متفائل',f.opt/100]].map(s=>({n:s[0],...calc(s[1])})),base=sc[1],rc=recs();
$('#fo').innerHTML=`<h2>النتائج الحسابية</h2><div class="grid g4" style="margin-bottom:16px">${[['هامش المساهمة للوحدة',M(b.c),'سعر البيع − التكلفة المتغيرة'],['نقطة التعادل',be?`<span class="num">${be}</span> وحدة شهريًا`:'غير محسوبة','الثابتة ÷ هامش المساهمة'+(be?'':' (الهامش غير موجب)')],['الإيرادات الشهرية',M(b.rev),'الوحدات × سعر البيع'],['الربح التشغيلي الشهري',M(b.op),'الإيرادات − المتغيرة − الثابتة'],['استرداد التأسيس',b.op>0?`<span class="num">${Math.ceil(f.setup/b.op)}</span> شهرًا`:'غير محسوب','التأسيس ÷ الربح الشهري']].map(x=>`<div class="card"><div class="mut" style="font-size:.9rem">${x[0]}</div><b style="font-size:1.25rem;color:var(--plum)">${x[1]}</b><div class="mut" style="font-size:.8rem">${x[2]}</div></div>`).join('')}</div><div class="card"><h3>مقارنة السيناريوهات <span class="badge demo">افتراضات قابلة للتعديل</span></h3>${scChart(sc)}<details open><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center">الجدول البديل للقيم</summary><div style="overflow-x:auto"><table class="tb"><caption class="mut" style="text-align:start">القيم الشهرية بالريال</caption><thead><tr><th scope="col">السيناريو</th><th scope="col">الوحدات</th><th scope="col">الإيرادات</th><th scope="col">التكاليف</th><th scope="col">الربح/الخسارة</th><th scope="col">الفرق عن الأساسي</th></tr></thead><tbody>${sc.map(s=>{const c=s.u*f.vc+f.fixed,d=s.op-base.op;return`<tr><th scope="row">${s.n}</th><td class="num">${Math.round(s.u)}</td><td class="num">${num(s.rev)}</td><td class="num">${num(c)}</td><td class="num">${num(s.op)}${s.op<0?' (خسارة)':''}</td><td class="num">${s.n=='أساسي'?'—':(d>0?'+':'')+num(d)}</td></tr>`}).join('')}</tbody></table></div></details></div>`;
$('#fr').innerHTML=`<h2 style="margin-top:20px">التوصيات</h2><div class="card">${rc.map((r,i)=>`<div class="task"><span class="tt"><b>${r[0]}</b><br><small class="mut">السبب: ${r[1]}</small></span><button class="btn sm" onclick="recTask(${i})">حوّلي إلى مهمة</button></div>`).join('')}<p class="mut" style="font-size:.85rem;margin:0">اقتراحات غير إلزامية مبنية على مدخلاتك فقط.</p></div>`;feasComp()}

function taskScore(t,td,cs){let s=0;const w=[],n=dd(td,t.d||td);

function briefMissing(){const p=S.projects[S.pi]||{},b=S.brief,m=[];if(!(p.desc&&p.desc.trim()))m.push(['desc','وصف الفكرة','ما الفكرة التي تريدين تنفيذها؟ اكتبيها في جملتين.']);if(!b.problem.trim())m.push(['problem','المشكلة','ما المشكلة التي تواجهها عميلتك وتريدين حلها؟']);if(!b.customer.trim())m.push(['customer','العميلة المستهدفة','من هي العميلة التي تعاني من هذه المشكلة تحديدًا؟']);if(!b.value.trim())m.push(['value','القيمة المقدمة','ما الذي تحصل عليه العميلة منك ولا تجده بسهولة عند غيرك؟']);if(!b.channel.trim())m.push(['channel','قناة البيع','أين وكيف ستصل العميلة إلى منتجك؟']);if(!(p.f&&p.f!='غير محدد'))m.push(['f','المجال','ما مجال نشاطك؟']);return m}
function vSummary(){const v=S.vlog,n=v.length,yes=v.filter(x=>x.will=='نعم').length,maybe=v.filter(x=>x.will=='ربما').length,no=v.filter(x=>x.will=='لا').length,prices=v.map(x=>+x.price).filter(x=>x>0).sort((a,b)=>a-b),needs=freq(v.map(x=>x.need)),objs=freq(v.map(x=>x.obj)),tg=(S.vcrit&&S.vcrit.target)||3,gaps=[];
if(n<tg)gaps.push('سجّلي '+(tg-n)+' مقابلة أو ملاحظة إضافية لتصلي إلى هدفك ('+tg+').');if(n&&!prices.length)gaps.push('لم تسجلي أي سعر ذكرته العميلات.');if(n&&!objs.length)gaps.push('لم تسجلي اعتراضات؛ اسألي «ما الذي قد يمنعك من الشراء؟».');if(n>=2&&yes==n)gaps.push('كل الردود إيجابية؛ جرّبي سؤال عميلات من خارج دائرتك القريبة للحد من التحيّز.');
return{n,yes,maybe,no,prices,needs,objs,tg,gaps}}

const fc=FK.filter(k=>S.ft[k]&&S.f[k]>0).length;if(fc<FK.length)G.push({t:'دراسة الجدوى: ينقص '+(FK.length-fc)+' من '+FK.length+' حقول',r:'feas',task:'إكمال حقول دراسة الجدوى',desc:'أدخلي سعر البيع والكمية والتكاليف',src:'feas'});else if(!S.fdone)G.push({t:'دراسة الجدوى مكتملة لكنها غير محفوظة',r:'feas',task:'حفظ دراسة الجدوى',desc:'',src:'feas'});

add('desc','وصف الفكرة',(p.desc||'').trim(),'brief',true);add('problem','المشكلة التي يحلها',b.problem.trim(),'brief',true);add('customer','العميلة المستهدفة',b.customer.trim(),'brief',true);add('value','القيمة المقدمة',b.value.trim(),'brief',true);add('channel','قناة البيع',b.channel.trim(),'brief',true);
add('time','الوقت المتاح',((S.st.time||'')+(S.dayMin?(S.st.time?' · ':'')+'خطة اليوم: '+S.dayMin+' دقيقة':'')).trim(),'tasks',RXC.task.test(q));
add('tasks','المهام المتأخرة وأهم مهمة',((late.length?'متأخرة: '+late.slice(0,3).map(t=>t.t).join('، '):'')+(pl.items[0]?((late.length?' | ':'')+'أهم مهمة: '+pl.items[0].t.t):'')),'tasks',RXC.task.test(q));

add('gaps','الفجوات التي تحتاج معالجة',allGaps().slice(0,4).map(g=>g.t).join('؛ '),'val',RXC.val.test(q));
it.forEach(x=>{x.sent=x.have&&x.rel&&(x.cat=='base'||!!on[x.cat]);x.st=!x.have?'غير متوفر':(x.cat!='base'&&!on[x.cat])?'متوقف':!x.rel?'لا يُرسل لهذا السؤال':'يُرسل'});return it}
function ctxText(q){const it=ctxModel(q).filter(x=>x.sent);return it.map(x=>x.l+': '+x.v).join('\n')}

P.mentor={view(){const p=S.projects;return H('مستشارتي الذكية','مساعدك الذكي لتحليل فكرتك، وتخطيط مشروعك، وفهم خطواتك القادمة.')+`<div class="note" style="margin-top:12px">عند توفر الاتصال تكون الردود مولَّدة بالذكاء الاصطناعي وقد تخطئ؛ وعند عدم توفره تظهر نتائج تجريبية جاهزة موسومة بوضوح. ليست رأيًا مهنيًا ولا ماليًا ولا قانونيًا ولا تتضمن بيانات سوق موثقة. للقرارات المهمة اطلبي رأي مستشارة بشرية من <a href="#/advisors" style="text-decoration:underline">دليل المستشارات</a>.</div><div class="card" style="margin-bottom:12px"><label for="pj">المشروع</label><select id="pj" onchange="S.pi=+this.value;route()">${p.length?p.map((x,i)=>`<option value="${i}" ${i==S.pi?'selected':''}>${esc(x.n)}</option>`).join(''):'<option>لا يوجد مشروع</option>'}</select><details style="margin-top:8px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600">ما تعرفه المستشارة عن مشروعي</summary><p class="mut" style="font-size:.85rem;margin:0 0 6px">تتحكمين فيما يُرسل مع أسئلتك. المعلومات الأساسية تُرسل دائمًا، والبقية بحسب المفاتيح وصلة السؤال بها.</p><div style="display:flex;gap:4px 14px;flex-wrap:wrap">${Object.keys(CTXCAT).map(k=>`<label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" ${S.ctxOn[k]?'checked':''} onchange="ctxToggle('${k}',this.checked)">${CTXCAT[k]}</label>`).join('')}</div><div id="ctxp" style="margin-top:8px"></div></details></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${ACT.map((a,i)=>`<button class="btn sm askbtn" onclick="sendQ(ACT[${i}][1])">${a[0]}</button>`).join('')}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${QS2.map((q,i)=>`<button class="btn sm sec askbtn" onclick="sendQ(QS2[${i}])">${q}</button>`).join('')}</div><div id="chat" class="card" style="min-height:140px" aria-live="polite"></div><div class="card" style="margin-top:12px"><label for="q">اكتبي فكرة مشروعك أو سؤالك هنا...</label><textarea id="q" oninput="ctxRefresh()"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn askbtn" onclick="const v=$('#q').value;if(v.trim()){$('#q').value=''}sendQ(v);ctxRefresh()">إرسال</button><button class="btn sec" onclick="S.chat=[];schedSave();route()">مسح المحادثة</button></div></div><h3 style="margin-top:20px">النتائج المحفوظة في المشروع</h3>${S.res.length?S.res.map((r,i)=>`<div class="task"><span class="tt">${esc(r.p)} · <span class="num">${r.d}</span><br><small class="mut">${esc(r.t.slice(0,80))}…</small></span><button class="btn sm sec" onclick="showRes(${i})">فتح</button><button class="btn dng sm" onclick="S.res.splice(${i},1);saveNow('تم حذف النتيجة').then(()=>route())">حذف</button></div>`).join(''):'<p class="mut">لا توجد نتائج محفوظة بعد.</p>'}`},init(){chatRender();lockAsk();ctxRefresh()}};

const _dr2=demoReply;
demoReply=function(prompt){const q=prompt.split('السؤال: ').pop(),fmt=(sum,rec,next,tasks)=>`الخلاصة: ${sum}\n\nالتوصية: ${rec}\n\nالخطوة التالية: ${next}\n\nمهام مقترحة:\n${tasks.map(t=>'- '+t[0]+' | '+capM(t[1])).join('\n')}\n\n(نتيجة تجريبية مبنية على بياناتك المدخلة فقط، وليست تحليلًا حقيقيًا ولا بيانات سوق.)`;
if(/أهم مهمة اليوم/.test(q)){const pl=dayPlan(S.dayMin),x=pl.items[0]||dayPlan(1e5).items[0];if(!x)return fmt('لا توجد مهام مفتوحة في هذا المشروع.','أضيفي مهمة صغيرة واحدة اليوم.','استخدمي زر «+» لإضافة مهمة.',[['كتابة أول مهمة للمشروع',15]]);return fmt('أهم مهمة الآن: «'+x.t.t+'» ('+x.m+' دقيقة).','ابدئي بها، فالسبب: '+x.why+'.','أنجزيها ثم علّميها مكتملة.',[[x.t.t,x.m]])}

return _dr2(prompt)};

const base=S.wkr.base,deltas=pr&&base&&base.at?pr.stages.map((s,i)=>({n:s.n,d:Math.round(((s.fr||0)-((base.fr&&base.fr[i])||0))*100)})).filter(x=>x.d!=0):[],pct=pr?pr.pct:0;
